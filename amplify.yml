version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
        # Diagnostic: confirms this file (not a build spec saved in the Amplify console) is in use, and whether CRON_SECRET reached the build. Never prints values.
        - 'if [ -n "$CRON_SECRET" ]; then C=yes; else C=NO; fi; echo "amplify.yml from repo v3 - CRON_SECRET present - $C - READ_ONLY_MODE - ${READ_ONLY_MODE:-unset}"'
        # Stop the deploy (the live site keeps running) if email can't be sent. Must match SES_ENV_VARS in src/lib/ses.ts.
        - node -e "const need=['SES_REGION','SES_ACCESS_KEY_ID','SES_SECRET_ACCESS_KEY','SES_FROM_EMAIL'];const missing=need.filter(k=>!process.env[k]);if(missing.length){console.error('Build stopped - set these Amplify environment variables - '+missing.join(', '));process.exit(1)}"
        - npx prisma migrate deploy
        # Every new server env var MUST be added to this keys list, or it will be empty at runtime on Amplify.
        - node -e "const fs=require('fs');const keys=['DATABASE_URL','DIRECT_URL','AUTH_SECRET','ADMIN_EMAIL','ADMIN_PASSWORD','S3_BUCKET_NAME','S3_REGION','S3_ACCESS_KEY_ID','S3_SECRET_ACCESS_KEY','RAZORPAY_KEY_ID','RAZORPAY_KEY_SECRET','SES_REGION','SES_ACCESS_KEY_ID','SES_SECRET_ACCESS_KEY','SES_FROM_EMAIL','NEXT_PUBLIC_SITE_URL','CRON_SECRET','READ_ONLY_MODE','ORGANISERS_EMAIL'];fs.writeFileSync('src/lib/env-runtime.ts','import '+JSON.stringify('server-only')+';\n'+keys.map(k=>'process.env.'+k+' = process.env.'+k+' || '+JSON.stringify(process.env[k]||'')+';').join('\n')+'\nexport {};\n')"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
