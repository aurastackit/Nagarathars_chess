version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
        - npx prisma db push
        - printf 'DATABASE_URL=%s\nDIRECT_URL=%s\nAUTH_SECRET=%s\nADMIN_EMAIL=%s\nADMIN_PASSWORD=%s\n' "$DATABASE_URL" "$DIRECT_URL" "$AUTH_SECRET" "$ADMIN_EMAIL" "$ADMIN_PASSWORD" > .env.production.local
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
