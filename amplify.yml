version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
        - npx prisma db push
        - node -e "const fs=require('fs');const keys=['DATABASE_URL','DIRECT_URL','AUTH_SECRET','ADMIN_EMAIL','ADMIN_PASSWORD'];fs.writeFileSync('src/lib/env-runtime.ts',keys.map(k=>'process.env.'+k+' = process.env.'+k+' || '+JSON.stringify(process.env[k]||'')+';').join('\n')+'\nexport {};\n')"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
