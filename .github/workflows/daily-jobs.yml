# Daily housekeeping on the live site (Amplify Hosting has no scheduler).
# Needs the repository secret CRON_SECRET, matching CRON_SECRET in the Amplify environment.
name: Daily jobs

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

jobs:
  expire-changes-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Reject applications with no update 7 days after changes were requested
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://nagaratharschesschampionship.org/api/cron/expire-changes-requests

  event-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Remind confirmed players 3 days before their tournament
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://nagaratharschesschampionship.org/api/cron/event-reminders

  document-retention:
    runs-on: ubuntu-latest
    steps:
      - name: Delete age proofs kept the retention period after their tournament (see /admin/privacy)
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://nagaratharschesschampionship.org/api/cron/document-retention

  registration-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The register API still accepts what the wizard sends (validates only, writes nothing)
        run: |
          status=$(curl --silent --show-error --max-time 60 -o response.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" --data @scripts/fixtures/register-dry-run.json \
            "https://nagaratharschesschampionship.org/api/tournaments/dry-run/register?dryRun=1")
          cat response.json; echo
          if [ "$status" != "200" ] || ! grep -q '"dryRun":true' response.json; then
            echo "::error::Registration dry-run failed (HTTP $status) — players may not be able to register. See src/lib/registration-payload.test.ts."
            exit 1
          fi
